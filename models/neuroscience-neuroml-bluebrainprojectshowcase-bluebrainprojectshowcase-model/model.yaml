schema_version: '2.0'
title: "BlueBrainProjectShowcase"
description: "A project to illustrate how models and data from the Blue Brain Project can be converted to NeuroML and PyNN. It can be used to explore neural activity dynamics and compare response patterns across conditions."
standard: other
tags:
- neuroscience
- neuroml
- opensourcebrain
- faithful
authors:
- Biosimulant Team
- Open Source Brain
upstream:
  id: opensourcebrain:BlueBrainProjectShowcase
  source_db: opensourcebrain
  source_id: BlueBrainProjectShowcase
  standard: neuroml
  original_url: https://github.com/OpenSourceBrain/BlueBrainProjectShowcase
  download_url: https://github.com/OpenSourceBrain/BlueBrainProjectShowcase.git
  license: NOASSERTION
biosim:
  entrypoint: src.bluebrainprojectshowcase_bluebrainprojectshowcase_model:BluebrainprojectshowcaseBluebrainprojectshowcaseModel
  init_kwargs:
    model_path: data/repo
  min_dt: 0.001
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - pyneuroml==0.9.17
    - numpy==1.26.4
io:
  outputs:
  - state
